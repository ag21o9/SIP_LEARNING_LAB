
[global]
type=global
user_agent=SIP-Learning-Lab

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; =================================
; EXTENSION 1001 - ORIGINAL CALLER
; =================================

[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1001
aors=1001

[auth1001]
type=auth
auth_type=userpass
username=1001
password=LabPass1001

[1001]
type=aor
max_contacts=1

; =================================
; EXTENSION 1002 - ALTERNATE IDENTITY
; =================================

[1002]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1002
aors=1002

[auth1002]
type=auth
auth_type=userpass
username=1002
password=LabPass1002

[1002]
type=aor
max_contacts=1

; =================================
; EXTENSION 1003 - RECEIVER
; =================================

[1003]
type=endpoint
context=internal
disallow=all
allow=ulaw
auth=auth1003
aors=1003

[auth1003]
type=auth
auth_type=userpass
username=1003
password=LabPass1003

[1003]
type=aor
max_contacts=1
